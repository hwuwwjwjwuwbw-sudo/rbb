<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Laro Tayo Roblox</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;overflow:auto;font-family:Arial,sans-serif;background:linear-gradient(160deg,#9dd9ff 0%,#f7b8df 48%,#ead4ff 100%);color:#63234d;padding:22px}
body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 15% 15%,#fff9 0 55px,transparent 56px),radial-gradient(circle at 85% 25%,#fff7 0 45px,transparent 46px),linear-gradient(180deg,transparent 70%,#ffffff30);pointer-events:none}
.bg{position:fixed;color:#e889ab30;font-size:35px;animation:float 5s ease-in-out infinite}
.a{left:10%;top:18%}.b{right:12%;top:25%;animation-delay:1s}.c{left:17%;bottom:15%;animation-delay:2s}.d{right:10%;bottom:18%;animation-delay:3s}
@keyframes float{50%{transform:translateY(-15px) rotate(8deg)}}
.card{position:relative;width:min(520px,94vw);padding:42px 28px;text-align:center;background:#fffafeea;border:3px solid #ffffffaa;border-radius:28px;box-shadow:0 25px 70px #9e557320;backdrop-filter:blur(14px)}
h1{font-size:clamp(32px,8vw,48px);margin:0 0 14px;color:#b21d68;text-shadow:0 3px #ffd7ec}.sub{color:#987c89;margin-bottom:28px}
button{font:inherit;font-weight:800;border:0;border-radius:15px;padding:14px 24px;cursor:pointer}
.yes{color:white;background:linear-gradient(135deg,#ff91b6,#e96394);box-shadow:0 10px 25px #e9639435}
.no{background:white;color:#765768;border:1px solid #e889ab30}
.buttons{position:relative;height:90px;display:flex;justify-content:center;align-items:flex-start;gap:12px}
#no{position:relative}
.message{display:none;margin-top:22px;color:#8a6576;font-size:14px}
.heart{font-size:62px;margin-bottom:10px;animation:pulse 1.2s infinite alternate}
@keyframes pulse{to{transform:scale(1.1)}}

.start-choice{margin:10px 0 20px}.choice-text{font-weight:800;margin-bottom:12px}.start-choice .buttons{height:55px}.start-choice .no{position:relative}
.player-wrap{position:relative;height:145px;margin:10px auto 18px;display:grid;place-items:center}
.player{width:78px;height:78px;border-radius:50%;background:#fff;border:4px solid #ff91b6;box-shadow:0 10px 25px #e9639430;display:grid;place-items:center;font-size:42px;cursor:pointer;user-select:none;position:absolute;transition:left .18s ease,top .18s ease,transform .12s ease;overflow:hidden}
.player img{width:100%;height:100%;object-fit:cover}
.player:active{transform:scale(.9)}
.upload{position:absolute;top:0;right:0;font-size:11px;padding:7px 10px;border-radius:10px;background:#fff0f5;color:#765768;cursor:pointer;z-index:3}
.upload input{display:none}
.game{margin-top:8px}
.game-title{font-weight:800;margin-bottom:8px}
.game-title span{color:#e96394}
.game-area{height:115px;border-radius:18px;background:#fff8fb;border:1px dashed #e889ab60;position:relative;overflow:hidden}
.hint{font-size:12px;color:#987c89;margin-top:7px}
.times{display:none;margin-top:14px;gap:8px;justify-content:center;flex-wrap:wrap}
.times button{background:white;color:#765768;border:1px solid #e889ab30;padding:10px 14px;border-radius:12px}
.times button:hover{background:#fff0f5}

.logo{font-size:13px;font-weight:900;letter-spacing:3px;color:#c52b78;margin-bottom:4px}
.choice-text{font-size:20px;color:#8e3b69}
.game-area{background:linear-gradient(#a9ddff,#d9c7ff 55%,#b9e8b0);box-shadow:inset 0 0 0 3px #ffffff99}
.game-area:before{content:"☁  ✦  ♡  ✦  ☁";position:absolute;top:7px;left:10px;right:10px;text-align:center;color:#fff;font-size:18px;letter-spacing:10px;opacity:.9}
.game-title{color:#a91f68;font-size:18px}
.player{width:92px;height:92px;border:0;background:transparent;box-shadow:0 8px 20px #6d427333}
.player img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 5px 4px #6d427344)}
.times button{background:linear-gradient(#fff,#fff4fb);border:2px solid #ef75ad;color:#9c2563;font-weight:800;box-shadow:0 4px 10px #b94d8322}
.times button:hover{transform:translateY(-2px);background:#ffe4f2}
</style>
</head>

  <div class="start-choice" id="startChoice">
    <div class="choice-text">Want to play a little game first?</div>
    <div class="buttons">
      <button class="yes" onclick="startGame()">Yes</button>
      <button class="no" id="noStart">No</button>
    </div>
  </div>

  <div class="game" id="game" style="display:none">
    <div class="game-title">Catch the player! <span id="score">0</span>/5</div>
    <div class="game-area" id="gameArea"></div>
    <div class="hint" id="hint">Catch the cute dog 5 times! 🐾</div>
  </div>

  <div class="buttons" id="area" style="display:none">
    <button class="yes" onclick="yes()">Done!</button>
  </div>

  <div class="message" id="message"></div>
  <div class="times" id="times">
    <button onclick="pickTime('8:00 PM')">8:00 PM</button>
    <button onclick="pickTime('8:30 PM')">8:30 PM</button>
    <button onclick="pickTime('9:00 PM')">9:00 PM</button>
    <button onclick="pickTime('9:30 PM')">9:30 PM</button>
    <button onclick="pickTime('10:00 PM')">10:00 PM</button>
    <button onclick="pickTime('10:30 PM')">10:30 PM</button>
    <button onclick="pickTime('11:00 PM')">11:00 PM</button>
  </div>
</div>

<script>
const player=document.getElementById("player");
const playerImage=document.getElementById("playerImage");
const gameArea=document.getElementById("gameArea");
const scoreEl=document.getElementById("score");
const hint=document.getElementById("hint");
const message=document.getElementById("message");
const times=document.getElementById("times");
const game=document.getElementById("game");
const area=document.getElementById("area");

let score=0;
let gameDone=false;

const startChoice=document.getElementById("startChoice");
const noStart=document.getElementById("noStart");

function startGame(){
  startChoice.style.display="none";
  game.style.display="block";
  movePlayer();
}

function moveNoStart(){
  const parent=startChoice.querySelector(".buttons");
  const maxX=Math.max(0,parent.clientWidth-noStart.offsetWidth);
  noStart.style.position="absolute";
  noStart.style.left=(Math.random()*maxX)+"px";
  noStart.style.top=(Math.random()*25)+"px";
}
noStart.addEventListener("mouseenter",moveNoStart);
noStart.addEventListener("touchstart",e=>{e.preventDefault();moveNoStart()},{passive:false});
noStart.addEventListener("click",moveNoStart);

function movePlayer(){
  const maxX=Math.max(0,gameArea.clientWidth-player.offsetWidth);
  const maxY=Math.max(0,gameArea.clientHeight-player.offsetHeight);
  player.style.left=(Math.random()*maxX)+"px";
  player.style.top=(Math.random()*maxY)+"px";
}

function catchPlayer(){
  if(gameDone) return;
  score++;
  scoreEl.textContent=score;
  if(score>=5){
    gameDone=true;
    hint.textContent="Nice! Now choose a time.";
    game.style.display="none";
    message.style.display="block";
    message.textContent="What time works for you?";
    times.style.display="flex";
    player.style.display="none";
  }else{
    movePlayer();
  }
}

player.addEventListener("click",catchPlayer);
window.addEventListener("resize",movePlayer);

playerImage.addEventListener("change",function(e){
  const file=e.target.files[0];
  if(!file) return;
  const url=URL.createObjectURL(file);
  player.innerHTML="";
  const img=document.createElement("img");
  img.src=url;
  img.alt="Player";
  player.appendChild(img);
});

function pickTime(time){
  times.style.display="none";
  message.textContent="Time selected: "+time+" 🎮";
  document.querySelector("h1").textContent="See you at "+time+"!";
  document.querySelector(".sub").textContent="Pick a time from 8 PM onwards. ♡";
  area.style.display="block";
  area.querySelector("button").textContent="Change time";
  area.querySelector("button").onclick=function(){
    area.style.display="none";
    message.textContent="Choose another time:";
    times.style.display="flex";
  };
}

</script>
</body>
</html>
